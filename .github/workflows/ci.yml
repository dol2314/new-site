name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: 데이터 확인 상태 (보고만)
        run: npm run validate:data
      - name: 빌드 (공개 전 모드)
        run: npm run build
      - name: SEO 검사 (공개 전 모드)
        run: npm run check:seo
      - name: 도구 페이지·사례 글 품질 검사
        run: npm run check:quality
      - name: 사례 글 유사도 검사
        run: npm run check:similarity
      - name: 공개 뒤 구조 미리 점검 (LAUNCH_PREVIEW, 링크·3클릭·준비 중 문구)
        run: LAUNCH_PREVIEW=1 npm run build && npm run check:launch
      - name: 빌드 (공개 모드 미리 점검)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_OPERATOR_NAME: CI 점검용
          NEXT_PUBLIC_OPERATOR_EMAIL: ci@example.com
      - name: SEO 검사 (공개 모드)
        run: npm run check:seo
        env:
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_OPERATOR_NAME: CI 점검용
          NEXT_PUBLIC_OPERATOR_EMAIL: ci@example.com
      - name: 공개 점검 (공개 모드)
        run: npm run check:launch
